<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Default anime avatar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2e28"/>
      <stop offset="100%" stop-color="#1a3d35"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2d2d2d"/>
    </linearGradient>
    <clipPath id="circle">
      <circle cx="64" cy="64" r="64"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circle)">
    <rect width="128" height="128" fill="url(#bg)"/>
    <!-- hair back -->
    <ellipse cx="64" cy="52" rx="46" ry="48" fill="url(#hair)"/>
    <!-- neck -->
    <rect x="52" y="92" width="24" height="28" rx="6" fill="#f3c9a8"/>
    <!-- face -->
    <ellipse cx="64" cy="68" rx="34" ry="38" fill="#f7d3b5"/>
    <!-- bangs -->
    <path fill="url(#hair)" d="M28 58c4-28 28-42 36-42s32 14 36 42c-8-10-18-16-36-16S36 48 28 58z"/>
    <path fill="#111" d="M34 42c8-14 22-22 30-22 8 0 22 8 30 22-10-8-20-12-30-12s-20 4-30 12z"/>
    <!-- eyes -->
    <ellipse cx="50" cy="70" rx="9" ry="11" fill="#fff"/>
    <ellipse cx="78" cy="70" rx="9" ry="11" fill="#fff"/>
    <ellipse cx="51" cy="72" rx="5" ry="7" fill="#2a5c4a"/>
    <ellipse cx="79" cy="72" rx="5" ry="7" fill="#2a5c4a"/>
    <circle cx="53" cy="69" r="2" fill="#fff"/>
    <circle cx="81" cy="69" r="2" fill="#fff"/>
    <!-- brows -->
    <path d="M40 58c4-3 12-4 18-2" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M70 56c6-2 14-1 18 2" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- blush -->
    <ellipse cx="42" cy="82" rx="6" ry="3.5" fill="#f0a0a0" opacity=".55"/>
    <ellipse cx="86" cy="82" rx="6" ry="3.5" fill="#f0a0a0" opacity=".55"/>
    <!-- nose / mouth -->
    <path d="M64 78v5" fill="none" stroke="#d4a07a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M58 90c3 3 9 3 12 0" fill="none" stroke="#c07070" stroke-width="2" stroke-linecap="round"/>
    <!-- shoulders -->
    <path fill="#1f4d42" d="M20 128c8-18 28-28 44-28s36 10 44 28H20z"/>
  </g>
</svg>
